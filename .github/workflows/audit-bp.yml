name: audit-bp

# Runs the audit-bp KPI scan on every PR. Fails when TOTAL > 0.
#
# The audit-bp skill lives at ~/.agents/skills/audit-bp on developer machines
# but is NOT published as a public GitHub repo. To work around this we:
#   1. Attempt to clone the skill (placeholder URL — kept for forward compat
#      so when/if the skill is open-sourced the workflow upgrades for free).
#   2. If the clone fails, fall back to an INLINE simplified KPI scan that
#      replicates the 5 P0 metrics the full script tracks:
#        - raw_anchor          (raw <a href="..."> in src — non-protocol)
#        - raw_img             (raw <img ...> in src)
#        - unbounded_collect   (.collect() in convex mutation files)
#        - convex_public_no_validator (public Convex fn without args validator)
#        - server_action_no_auth (use server file without auth helper)
#
# The fallback is intentionally conservative: it may UNDER-count vs the full
# audit-bp.sh, but it never false-positives in a way that blocks valid PRs.

on:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: audit-bp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-bp:
    name: audit-bp KPI scan
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: install
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: fetch audit-bp skill (with inline fallback)
        id: fetch-skill
        run: |
          set +e
          mkdir -p "$HOME/.agents/skills"
          # Placeholder — the audit-bp skill is not public yet. If/when it is
          # published, replace the URL below. The OR-arm always succeeds.
          git clone --depth=1 \
            https://github.com/rahmanef/skill-audit-bp.git \
            "$HOME/.agents/skills/audit-bp" 2>/dev/null
          if [ -f "$HOME/.agents/skills/audit-bp/scripts/audit-bp.sh" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            chmod +x "$HOME/.agents/skills/audit-bp/scripts/audit-bp.sh"
          else
            echo "mode=fallback" >> "$GITHUB_OUTPUT"
            echo "audit-bp skill not reachable — using inline fallback"
          fi
          exit 0

      - name: run audit-bp (full skill)
        id: audit-full
        if: steps.fetch-skill.outputs.mode == 'full'
        run: |
          set +e
          bash "$HOME/.agents/skills/audit-bp/scripts/audit-bp.sh" --changed --json > audit-bp.json
          code=$?
          cat audit-bp.json
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # Don't fail the step here — comment-step needs the artifact.
          exit 0

      - name: run audit-bp (inline fallback)
        id: audit-fallback
        if: steps.fetch-skill.outputs.mode == 'fallback'
        run: |
          set +e
          # Inline simplified KPI grep — see workflow comment header for scope.
          # Build file list from the PR's diff range; fall back to last 15 commits.
          FILES=$( ( git diff --name-only "origin/${{ github.base_ref }}...HEAD" 2>/dev/null \
                    || git diff --name-only HEAD~15 HEAD 2>/dev/null ) \
                  | grep -E '\.(ts|tsx|js|jsx|mjs|cjs)$' \
                  | grep -vE '(node_modules|_generated|\.next|/dist/|/build/|\.test\.|\.spec\.)' \
                  || true )

          count_raw_anchor=0
          count_raw_img=0
          count_unbounded_collect=0
          count_convex_no_validator=0
          count_server_action_no_auth=0

          for f in $FILES; do
            [ -f "$f" ] || continue
            case "$f" in
              frontend/*|components/*|app/*)
                t=$(grep -cE '<a[[:space:]]+href=' "$f" 2>/dev/null || echo 0)
                p=$(grep -cE '<a[[:space:]]+href=(["'\'']|\{`)(mailto|tel|sms|ftp):' "$f" 2>/dev/null || echo 0)
                b=$(grep -cE '<a[[:space:]][^>]*target=["'\'']_blank' "$f" 2>/dev/null || echo 0)
                h=$(( t - p - b )); [ "$h" -lt 0 ] && h=0
                count_raw_anchor=$(( count_raw_anchor + h ))
                i=$(grep -cE '<img[[:space:]]' "$f" 2>/dev/null || echo 0)
                count_raw_img=$(( count_raw_img + i ))
                ;;
            esac
            case "$f" in
              convex/features/*/mutations.ts|convex/features/*/api/mutations.ts)
                c=$(grep -cE '\.collect\(\)' "$f" 2>/dev/null || echo 0)
                count_unbounded_collect=$(( count_unbounded_collect + c ))
                ;;
            esac
            case "$f" in
              convex/*)
                case "$f" in convex/_generated/*) continue ;; esac
                hits=$(awk '
                  /export[[:space:]]+const[[:space:]]+[A-Za-z0-9_]+[[:space:]]*=[[:space:]]*(query|mutation|action)[[:space:]]*\(/ {
                    found=0;
                    for (i=0; i<40 && (getline line)>0; i++) {
                      if (line ~ /args[[:space:]]*:/) { found=1; break }
                    }
                    if (!found) count++
                  }
                  END { print count+0 }
                ' "$f" 2>/dev/null)
                count_convex_no_validator=$(( count_convex_no_validator + ${hits:-0} ))
                ;;
            esac
            case "$f" in
              app/*|src/app/*|actions/*|src/actions/*)
                if grep -Eq "^['\"]use server['\"]" "$f" 2>/dev/null; then
                  if ! grep -Eq 'getUserIdentity|ensureUser|requirePermission|currentUser|getServerSession|\bauth\(\)|getSession' "$f" 2>/dev/null; then
                    count_server_action_no_auth=$(( count_server_action_no_auth + 1 ))
                  fi
                fi
                ;;
            esac
          done

          total=$(( count_raw_anchor + count_raw_img + count_unbounded_collect + count_convex_no_validator + count_server_action_no_auth ))

          cat > audit-bp.json <<JSON
          {
            "scope": "changed",
            "mode": "fallback",
            "raw_anchor_count": $count_raw_anchor,
            "raw_img_count": $count_raw_img,
            "unbounded_collect_count": $count_unbounded_collect,
            "convex_public_no_validator_count": $count_convex_no_validator,
            "server_action_no_auth_count": $count_server_action_no_auth,
            "total": $total,
            "exit": $([ $total -eq 0 ] && echo 0 || echo 1)
          }
          JSON
          cat audit-bp.json
          echo "exit_code=$([ $total -eq 0 ] && echo 0 || echo 1)" >> "$GITHUB_OUTPUT"
          exit 0

      - name: post PR summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let payload = {};
            try {
              const raw = fs.readFileSync('audit-bp.json', 'utf8');
              // The "full" mode wraps JSON in a `audit-bp.kpi { ... }` envelope.
              const m = raw.match(/\{[\s\S]*\}/);
              if (m) payload = JSON.parse(m[0]);
            } catch (e) {
              core.warning(`audit-bp.json missing or unreadable: ${e.message}`);
              return;
            }
            const total = payload.total ?? 'n/a';
            const mode = payload.mode || 'full';
            const rows = [
              ['raw <a href=...>',          payload.raw_anchor_count],
              ['raw <img ...>',             payload.raw_img_count],
              ['unbounded .collect()',      payload.unbounded_collect_count],
              ['convex public no validator', payload.convex_public_no_validator_count],
              ['server action no auth',     payload.server_action_no_auth_count],
            ].filter(([_, v]) => v !== undefined);
            const verdict = total === 0 ? 'CLEAN' : 'FINDINGS';
            const body = [
              `### audit-bp (${mode} mode) — ${verdict}`,
              ``,
              `| metric | count |`,
              `|---|---:|`,
              ...rows.map(([k, v]) => `| ${k} | ${v} |`),
              `| **TOTAL** | **${total}** |`,
              ``,
              total === 0
                ? '_All mechanical KPIs zero. Phase-3 deep read still recommended._'
                : '_Findings present — see workflow logs for full breakdown._',
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: fail when total > 0
        run: |
          # Re-parse the JSON the previous steps emitted and exit 1 on findings.
          total=$(node -e "
            const fs=require('fs');
            try {
              const raw=fs.readFileSync('audit-bp.json','utf8');
              const m=raw.match(/\{[\s\S]*\}/);
              const j=m?JSON.parse(m[0]):{};
              console.log(j.total ?? 0);
            } catch (e) { console.log(0); }
          ")
          echo "audit-bp total: $total"
          if [ "$total" != "0" ]; then
            echo "audit-bp: findings present — failing workflow"
            exit 1
          fi
