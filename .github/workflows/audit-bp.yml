name: audit-bp (advisory)

# ADVISORY SIGNAL — NOT A MERGE GATE.
#
# The full `audit-bp` skill is private: it lives at `~/.agents/skills/audit-bp`
# on developer machines and is not published anywhere cloneable. There is no
# public URL to fetch, so nothing here tries to clone one.
#
# What this workflow does instead: an INLINE simplified KPI scan over the
# changed files only, covering 5 mechanical P0 metrics:
#   - raw <a href="...">      in app/components/frontend source
#   - raw <img ...>           in app/components/frontend source
#   - unbounded .collect()    in convex mutation files
#   - convex public fn        without an `args` validator
#   - `use server` file       without an auth helper
#
# It under-counts relative to the real skill (grep-level, changed files only),
# which is exactly why it is advisory: findings are reported as a PR comment
# and in the job summary, and the job never fails the build. Deep review still
# requires the private skill locally.
#
# Do not describe this workflow as "gated" or "score >= 80 to ship" anywhere.
# The blocking checks live in ci.yml and validate-manifests.yml.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: audit-bp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kpi-scan:
    name: kpi-scan (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Advisory only: never block a merge on a grep-level approximation.
    continue-on-error: true
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: run inline KPI scan (advisory)
        id: scan
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set +e
          # Diff base: PR target branch when available, else the previous
          # commit on main, else the last 15 commits (shallow-history safety).
          if [ -n "$BASE_REF" ] && git rev-parse --verify "origin/$BASE_REF" >/dev/null 2>&1; then
            RANGE="origin/$BASE_REF...HEAD"
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            RANGE="HEAD~1 HEAD"
          else
            RANGE="HEAD~15 HEAD"
          fi
          echo "diff range: $RANGE"

          FILES=$( git diff --name-only $RANGE 2>/dev/null \
                    | grep -E '\.(ts|tsx|js|jsx|mjs|cjs)$' \
                    | grep -vE '(node_modules|_generated|\.next|/dist/|/build/|\.test\.|\.spec\.)' \
                    || true )

          count_raw_anchor=0
          count_raw_img=0
          count_unbounded_collect=0
          count_convex_no_validator=0
          count_server_action_no_auth=0

          for f in $FILES; do
            [ -f "$f" ] || continue
            case "$f" in
              frontend/*|components/*|app/*)
                t=$(grep -cE '<a[[:space:]]+href=' "$f" 2>/dev/null || true)
                p=$(grep -cE '<a[[:space:]]+href=(["'\'']|\{`)(mailto|tel|sms|ftp):' "$f" 2>/dev/null || true)
                b=$(grep -cE '<a[[:space:]][^>]*target=["'\'']_blank' "$f" 2>/dev/null || true)
                h=$(( ${t:-0} - ${p:-0} - ${b:-0} )); [ "$h" -lt 0 ] && h=0
                count_raw_anchor=$(( count_raw_anchor + h ))
                i=$(grep -cE '<img[[:space:]]' "$f" 2>/dev/null || true)
                count_raw_img=$(( count_raw_img + ${i:-0} ))
                ;;
            esac
            case "$f" in
              convex/features/*/mutations.ts|convex/features/*/api/mutations.ts)
                c=$(grep -cE '\.collect\(\)' "$f" 2>/dev/null || true)
                count_unbounded_collect=$(( count_unbounded_collect + ${c:-0} ))
                ;;
            esac
            case "$f" in
              convex/*)
                case "$f" in convex/_generated/*) continue ;; esac
                hits=$(awk '
                  /export[[:space:]]+const[[:space:]]+[A-Za-z0-9_]+[[:space:]]*=[[:space:]]*(query|mutation|action)[[:space:]]*\(/ {
                    found=0;
                    for (i=0; i<40 && (getline line)>0; i++) {
                      if (line ~ /args[[:space:]]*:/) { found=1; break }
                    }
                    if (!found) count++
                  }
                  END { print count+0 }
                ' "$f" 2>/dev/null)
                count_convex_no_validator=$(( count_convex_no_validator + ${hits:-0} ))
                ;;
            esac
            case "$f" in
              app/*|src/app/*|actions/*|src/actions/*)
                if grep -Eq "^['\"]use server['\"]" "$f" 2>/dev/null; then
                  if ! grep -Eq 'getUserIdentity|ensureUser|requirePermission|currentUser|getServerSession|\bauth\(\)|getSession' "$f" 2>/dev/null; then
                    count_server_action_no_auth=$(( count_server_action_no_auth + 1 ))
                  fi
                fi
                ;;
            esac
          done

          total=$(( count_raw_anchor + count_raw_img + count_unbounded_collect + count_convex_no_validator + count_server_action_no_auth ))

          cat > audit-bp.json <<JSON
          {
            "scope": "changed",
            "mode": "inline-advisory",
            "raw_anchor_count": $count_raw_anchor,
            "raw_img_count": $count_raw_img,
            "unbounded_collect_count": $count_unbounded_collect,
            "convex_public_no_validator_count": $count_convex_no_validator,
            "server_action_no_auth_count": $count_server_action_no_auth,
            "total": $total
          }
          JSON
          cat audit-bp.json
          echo "total=$total" >> "$GITHUB_OUTPUT"
          exit 0

      - name: job summary
        if: always()
        run: |
          {
            echo "### audit-bp inline KPI scan (advisory)"
            echo
            echo "Not a merge gate. Under-counts vs the private skill; no score threshold is enforced."
            echo
            if [ -f audit-bp.json ]; then
              echo '```json'
              cat audit-bp.json
              echo '```'
            else
              echo "_scan produced no output_"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: post PR summary (advisory)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let payload = {};
            try {
              const raw = fs.readFileSync('audit-bp.json', 'utf8');
              const m = raw.match(/\{[\s\S]*\}/);
              if (m) payload = JSON.parse(m[0]);
            } catch (e) {
              core.warning(`audit-bp.json missing or unreadable: ${e.message}`);
              return;
            }
            const total = payload.total ?? 'n/a';
            const rows = [
              ['raw <a href=...>',            payload.raw_anchor_count],
              ['raw <img ...>',               payload.raw_img_count],
              ['unbounded .collect()',        payload.unbounded_collect_count],
              ['convex public no validator',  payload.convex_public_no_validator_count],
              ['server action no auth',       payload.server_action_no_auth_count],
            ].filter(([_, v]) => v !== undefined);
            const body = [
              `### audit-bp inline KPI scan — advisory (${total === 0 ? 'no findings' : 'findings'})`,
              ``,
              `| metric | count |`,
              `|---|---:|`,
              ...rows.map(([k, v]) => `| ${k} | ${v} |`),
              `| **TOTAL** | **${total}** |`,
              ``,
              `_Advisory only — does not block merge. The full audit-bp skill is private and not reproducible in CI; run it locally for a real score._`,
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
