name: CI

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (typecheck + lint + test + slices + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          # audit-bp needs HEAD~15 for --changed scope; full history is also
          # useful for the contracts-drift post-merge workflow.
          fetch-depth: 0

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: cache .next/cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**/*.{ts,tsx,js,jsx}', 'components/**/*.{ts,tsx,js,jsx}', 'frontend/**/*.{ts,tsx,js,jsx}') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-next-

      - name: install
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: test
        run: npm run test

      # slices:check chain = validate:slices -> audit:slices -> gen:slices:check
      #                    -> validate:manifests -> validate:contracts
      # (covers the Phase A contract validator already)
      - name: slices check
        run: npm run slices:check

      - name: build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  template-base-typecheck:
    name: typecheck (template-base copy-source)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: template-base
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: template-base/package-lock.json
      - name: install
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: typecheck
        run: npx tsc --noEmit

  cli-prepublish:
    name: CLI prepublish gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: sync-skills check
        run: node scripts/sync-skills.mjs --check
      - name: validate manifest
        run: node scripts/validate.mjs
      - name: validate slices
        working-directory: .
        run: node packages/cli/scripts/validate-slice.mjs --check

  audit:
    name: high-severity vuln gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: audit (high)
        run: npm audit --audit-level=high --omit=dev
      - name: audit cli (high)
        working-directory: packages/cli
        run: npm install --no-audit --no-fund && npm audit --audit-level=high --omit=dev
