name: Validate Slice Manifests

# Gated on push to main and on PRs. Path filter keeps the job off PRs that
# cannot possibly change a slice manifest (docs, app-only edits, ...).
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "frontend/slices/**"
      - "template-base/**"
      - "packages/cli/**"
      - "lib/content/**"
      - "scripts/validation/**"
      - ".github/workflows/validate-manifests.yml"
  push:
    branches: [main]
    paths:
      - "frontend/slices/**"
      - "template-base/**"
      - "packages/cli/**"
      - "lib/content/**"
      - "scripts/validation/**"
      - ".github/workflows/validate-manifests.yml"

permissions:
  contents: read

concurrency:
  group: validate-manifests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: schema validate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: validate slice.manifest.json against schema v1
        run: node scripts/validation/validate-manifests.mjs
